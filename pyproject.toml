[project]
name = "substage"
version = "0.1.0"
description = "Scene-aware multimodal English to Korean video subtitle translator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Byeonghoon Yoo", email = "bhyoo@bhyoo.com" }
]
keywords = ["subtitles", "srt", "translation", "korean", "multimodal", "gemini", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.15"
dependencies = [
    "google-genai>=2.31.0",
    "kiwipiepy>=0.24.0",
    "pydantic>=2.14.1",
    "pysubs2>=1.9.0",
    "pyyaml>=6.0.3",
    "subliminal>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/isac322/substage"
Repository = "https://github.com/isac322/substage"
Issues = "https://github.com/isac322/substage/issues"

[project.scripts]
substage = "substage.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
